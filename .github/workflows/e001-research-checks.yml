name: E001 research software checks
on:
  push:
    paths:
      - 'research/**'
      - '.github/workflows/e001-research-checks.yml'
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/e001-research-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software-only:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test schema, provenance and failure handling
        run: python -m unittest e001_tests e001_batch_tests -v
      - name: Run synthetic demonstration (not hardware validation)
        run: python e001_demo.py --out e001_ci_output
      - name: Check local Markdown file links
        run: python e001_check_links.py .
      - name: Audit a synthetic accepted-record batch
        run: python e001_batch.py e001_reference.json e001_changed.json --config e001_demo_config.json --out e001_ci_batch
